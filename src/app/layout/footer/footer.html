<footer class="footer">
  <div class="container footer__row">
    <nav class="footer__nav" aria-label="Footer">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path">{{ link.label }}</a>
      }
    </nav>

    <div class="footer__langs" role="group" aria-label="Language">
      @for (lang of languages; track lang.code) {
        <button
          type="button"
          [disabled]="!lang.available"
          [attr.aria-pressed]="lang.available"
          [attr.title]="lang.available ? lang.name : lang.name + ' (coming soon)'"
        >
          {{ lang.code }}
        </button>
      }
    </div>
  </div>

  <p class="container footer__note">© {{ year }} Jbalna · Find your guide, conquer your mountain.</p>
</footer>
